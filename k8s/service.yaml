apiVersion: v1
kind: Service
metadata:
  name: gists-api-server
  labels:
    app: gists-api-server
spec:
  type: NodePort
  selector:
    app: gists-api-server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      # Minikube exposes NodePort services via `minikube service <name>`
      # nodePort is left unset so Kubernetes assigns one automatically (30000-32767)
